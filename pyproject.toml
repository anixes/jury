[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jury-mcp"
version = "3.0.0"
description = "A resilient multi-model deliberation mesh, MCP server, and zero-token code synthesis engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "AJA Engineering" }
]
keywords = [
    "ai", "mcp", "model-context-protocol", "peer-review", "code-review",
    "architecture", "multi-model", "deliberation", "cli"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
dependencies = [
    "click>=8.1.7",
    "filelock>=3.13.1",
    "httpx>=0.26.0",
    "mcp>=1.0.0",
    "openai>=1.0.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
]

[project.scripts]
triad = "triad.cli:main"
jury = "jury.cli.main:main"
jury-mcp = "jury.mcp_server.server:main"

[tool.setuptools.package-dir]
"" = "."
jury = "src/jury"

[tool.setuptools.packages.find]
where = [".", "src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "src"]
testpaths = ["tests"]
